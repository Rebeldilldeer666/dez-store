<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Rebellious Bytes — bold digital goods and creative tools." />
    <meta name="theme-color" content="#0b0d12" />
    <title>Rebellious Bytes</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #0b0d12; color: #f4f6fb; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; background: #0b0d12; }
      main { min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
      .shell { width: min(960px, 100%); border: 1px solid #2a3040; background: #121722; padding: clamp(2rem, 7vw, 5rem); }
      .eyebrow { color: #7ee2c0; font-size: .75rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      h1 { max-width: 700px; margin: 1rem 0; font-size: clamp(2.75rem, 8vw, 6.5rem); line-height: .95; letter-spacing: -.06em; }
      p { max-width: 560px; color: #aeb7c8; font-size: clamp(1rem, 2vw, 1.25rem); line-height: 1.6; }
      .actions { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 2rem; }
      a { display: inline-flex; padding: .8rem 1.1rem; border: 1px solid #7ee2c0; color: #0b0d12; background: #7ee2c0; font-weight: 700; text-decoration: none; }
      a.secondary { color: #f4f6fb; background: transparent; border-color: #2a3040; }
      footer { margin-top: 4rem; color: #697386; font-size: .875rem; }
    </style>
  </head>
  <body>
    <main>
      <section class="shell" aria-labelledby="title">
        <div class="eyebrow">Rebellious Bytes</div>
        <h1 id="title">Digital goods for people who make their own rules.</h1>
        <p>Discover sharp tools, limited drops, and creative resources built for independent builders.</p>
        <div class="actions">
          <a href="mailto:hello@rebelliousbytes.shop">Get in touch</a>
          <a class="secondary" href="https://rebelliousbytes.shop">Visit the shop</a>
        </div>
        <footer>Secure storefront experience. No credentials are stored in this site.</footer>
      </section>
    </main>
  </body>
</html>
